<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08110c">
  <meta name="description" content="Snakes — 在瀏覽器裡玩的貪吃蛇。吃蘋果、躲牆壁、別咬到自己。">
  <title>Snakes</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
          <rect width="48" height="48" rx="16" fill="#143222"/>
          <path d="M9 31c3.2-8 8-10.5 10.5-5.2 2.2 4.6 2.4 9.2 7.2 7.2 4.2-1.8 5.6-8.8 9-6.2" fill="none" stroke="#d6ff6b" stroke-width="5" stroke-linecap="round"/>
          <circle cx="36.5" cy="14" r="4" fill="#ff5a5f"/>
          <path d="M36 10.5c1.6-2.4 4.2-2.6 5.4-.8" fill="none" stroke="#8be06a" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Snakes</h1>
          <p>夜裡的果園</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>分數</span><strong id="score">0</strong></div>
        <div class="stat" id="best-stat"><span>最佳</span><strong id="best">0</strong></div>
        <div class="stat"><span>長度</span><strong id="length">3</strong></div>
        <button id="mute" type="button">音效開</button>
      </div>
    </header>

    <section class="stage">
      <div class="board" id="board">
        <canvas id="game" width="640" height="640" aria-label="Snakes 遊戲畫面"></canvas>
        <p id="toast" class="toast" hidden>金蘋果 · 50 分</p>
        <div class="overlay" id="overlay">
          <h2 id="overlay-title">Snakes</h2>
          <p id="overlay-text">方向鍵或 WASD 移動。<br>紅蘋果 10 分，每五顆出現金蘋果。<br>撞牆或咬到自己就結束。</p>
          <button id="action" class="action" type="button">開始</button>
        </div>
      </div>
      <div class="pad" aria-label="方向鍵">
        <button type="button" data-dir="up" aria-label="上">↑</button>
        <button type="button" data-dir="left" aria-label="左">←</button>
        <button type="button" data-dir="down" aria-label="下">↓</button>
        <button type="button" data-dir="right" aria-label="右">→</button>
      </div>
    </section>
    <p class="hint">方向鍵或 WASD · 空白鍵暫停 · R 重來 · 可滑動</p>
    <p id="live" class="sr-only" aria-live="polite"></p>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
